<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์ควบคุมคุณภาพ | SOPVision</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/clean.css"><link rel="stylesheet" href="/static/worker.css?v=large-camera-1"><link rel="stylesheet" href="/static/auth.css"><script src="/static/auth-client.js?v=role-login-2" defer></script><script src="/static/access.js?v=word-7" defer></script><link rel="icon" type="image/png" href="/static/brand/sopvision-logo-current.png?v=brand-4"><link rel="stylesheet" href="/static/brand.css?v=brand-4"></head>
<body><main class="worker-shell access-shell"><header class="worker-header"><a href="/" class="worker-brand"><img class="brand-image" src="/static/brand/sopvision-logo-current.png?v=brand-4" width="1024" height="338" alt="SOPVision AI — Intelligent Inspection"></a><a href="/admin">ดูยอดผลิตและรายงาน ↗</a></header><div class="access-heading"><span class="eyebrow">ตรวจสอบงาน</span><h1>งานรอพิจารณา</h1><p>ตรวจผลและหลักฐานก่อนอนุมัติให้ตรวจซ้ำ</p></div><p id="accessMessage" role="status" aria-live="polite"></p>
<section class="access-card"><div class="access-title"><h2>คิวหัวหน้างาน</h2><button id="refreshReviews" class="btn btn-outline">รีเฟรช</button></div><div class="access-filters"><label>ประเภทงาน <select id="reviewScope"><option value="production">ผลิตจริง</option><option value="test">ทดสอบ</option><option value="all">ทั้งหมด</option></select></label><label>สถานะ <select id="reviewStatus"><option value="pending">รอพิจารณา</option><option value="closed">พิจารณาแล้ว</option><option value="all">ทั้งหมด</option></select></label></div><div id="reviewRows">กำลังอ่านคิว…</div></section>
<section id="userSection" class="access-card" hidden><h2>บัญชีและสิทธิ์ผู้ใช้</h2><p>สร้างบัญชีสำหรับผู้ตรวจ หัวหน้างาน และแอดมิน ส่วนพนักงานเลือกสเตชั่นได้โดยไม่ต้องมีบัญชี</p><form id="userForm" class="access-user-form"><label>ชื่อบัญชี<input name="username" required pattern="[A-Za-z0-9_.-]{3,80}" autocomplete="off" placeholder="เช่น operator01"></label><label>ชื่อแสดง<input name="display_name" maxlength="100" required></label><label>รหัสผ่านเริ่มต้น<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>บทบาท<select name="role"><option value="operator">พนักงาน</option><option value="qc">QC</option><option value="supervisor">หัวหน้างาน</option><option value="admin">แอดมิน</option></select></label><button class="btn btn-primary">สร้างบัญชี</button></form><div id="userRows"></div></section>
<section id="auditSection" class="access-card" hidden><h2>ประวัติการจัดการระบบ</h2><div id="auditRows"></div></section></main></body></html>
